version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Usa Node.js 22.16
        - nvm install 22.16.0
        - nvm use 22.16.0

        # Crea il file .env.production
        - |
          case "${AWS_BRANCH}" in
            dev)
              ASSETS_ABSOLUTE_PATH="https://dev.d3ioasbw4fm7q5.amplifyapp.com/"
              DOCUMENTS_API_URL="https://1k4mxza2e2.execute-api.eu-central-1.amazonaws.com/dev"
              DOCUMENTS_APP_CLIENT_ID="g6gl9yq2dmanydpcmabfyik10wj6dxf"
              ;;
            staging)
              ASSETS_ABSOLUTE_PATH="https://staging.d3ioasbw4fm7q5.amplifyapp.com/"
              DOCUMENTS_API_URL="https://rtpc12l9k0.execute-api.eu-central-1.amazonaws.com/sandbox"
              DOCUMENTS_APP_CLIENT_ID="ooty5p0sanjii578e42z4mqbjj527av"
              ;;
            *)
              ASSETS_ABSOLUTE_PATH="https://main.d3ioasbw4fm7q5.amplifyapp.com/"
              DOCUMENTS_API_URL="https://lz99vnt7i6.execute-api.eu-central-1.amazonaws.com/prod"
              DOCUMENTS_APP_CLIENT_ID="p8p1hocd9flemzv0b1wax0zq407kemd"
              ;;
          esac

          cat > apps/storefront/.env.production << EOF
          VITE_B2B_URL=https://api-b2b.bigcommerce.com
          VITE_LOCAL_APP_CLIENT_ID=qxvapwlk4fbb9dyogdcxk9o50d9jqjo
          VITE_IS_LOCAL_ENVIRONMENT=FALSE
          VITE_ASSETS_ABSOLUTE_PATH=${ASSETS_ABSOLUTE_PATH}
          VITE_DISABLE_BUILD_HASH=TRUE
          VITE_DOCUMENTS_API_URL=${DOCUMENTS_API_URL}
          VITE_DOCUMENTS_APP_CLIENT_ID=${DOCUMENTS_APP_CLIENT_ID}
          EOF

        # Installa le dipendenze
        - yarn install --frozen-lockfile

    build:
      commands:
        - yarn build

  artifacts:
    baseDirectory: apps/storefront/dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .yarn/cache/**/*
